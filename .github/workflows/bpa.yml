name: bpa
  
on:
  pull_request:
    branches: 
      - dev
      - prp
      - prd
      - main      
    paths:
      - '**/src/*.Report/**'
      - '**/src/*.SemanticModel/**'
  
  workflow_dispatch:
        
jobs:
  
  bpa:   
    runs-on: windows-latest
    
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Validate parameters mapping
        run: python scripts/validate_parameters.py --src src --mapping workspace-mapping.yml

      - name: Semantic Models
        run: .\scripts\bpa-semanticmodel.ps1 -path "." -src "./src/*.SemanticModel"
    
      - name: Reports
        run: .\scripts\bpa-report.ps1 -path "." -src "./src/*.Report"